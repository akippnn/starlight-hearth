# yaml-language-server: $schema=/usr/share/inputplumber/schema/device_profile_v1.json
version: 1
kind: DeviceProfile
name: Hearth Desktop v2
description: Controller-to-keyboard and mouse ownership for Hearth Desktop
target_devices:
  - keyboard
  - mouse

mapping:
  - name: Focus up
    source_event: {gamepad: {button: DPadUp}}
    target_events: [{keyboard: KeyUp}]
  - name: Focus down
    source_event: {gamepad: {button: DPadDown}}
    target_events: [{keyboard: KeyDown}]
  - name: Focus left
    source_event: {gamepad: {button: DPadLeft}}
    target_events: [{keyboard: KeyLeft}]
  - name: Focus right
    source_event: {gamepad: {button: DPadRight}}
    target_events: [{keyboard: KeyRight}]

  - name: Accept
    source_event: {gamepad: {button: South}}
    target_events: [{keyboard: KeyEnter}]
  - name: Back
    source_event: {gamepad: {button: East}}
    target_events: [{keyboard: KeyEsc}]
  - name: Toggle
    source_event: {gamepad: {button: West}}
    target_events: [{keyboard: KeySpace}]
  - name: On-screen keyboard
    source_event: {gamepad: {button: North}}
    target_events: [{keyboard: KeyF12}]
  - name: Hearth Home
    source_event: {gamepad: {button: Start}}
    target_events: [{keyboard: KeyF10}]
  - name: niri overview
    source_event: {gamepad: {button: Select}}
    target_events: [{keyboard: KeyF9}]

  - name: Previous focus group
    source_event: {gamepad: {button: LeftBumper}}
    target_events:
      - keyboard: KeyLeftShift
      - keyboard: KeyTab
  - name: Next focus group
    source_event: {gamepad: {button: RightBumper}}
    target_events: [{keyboard: KeyTab}]

  - name: Pointer
    source_event: {gamepad: {axis: {name: RightStick, deadzone: 0.2}}}
    target_events: [{mouse: {motion: {speed_pps: 900}}}]
  - name: Primary click
    source_event: {gamepad: {trigger: {name: RightTrigger, deadzone: 0.2}}}
    target_events: [{mouse: {button: Left}}]
  - name: Secondary click
    source_event: {gamepad: {trigger: {name: LeftTrigger, deadzone: 0.2}}}
    target_events: [{mouse: {button: Right}}]

  - name: Scroll up
    source_event: {gamepad: {axis: {name: LeftStick, direction: up, deadzone: 0.25}}}
    target_events: [{mouse: {button: WheelUp}}]
  - name: Scroll down
    source_event: {gamepad: {axis: {name: LeftStick, direction: down, deadzone: 0.25}}}
    target_events: [{mouse: {button: WheelDown}}]

# Guide is deliberately absent. Hearth never maps or intercepts it.
