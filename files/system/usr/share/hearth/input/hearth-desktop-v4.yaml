# yaml-language-server: $schema=/usr/share/inputplumber/schema/device_profile_v1.json
version: 1
kind: DeviceProfile
name: hearthOS Desktop v4
description: HSN-001 semantic shell actions with deliberate pointer and scroll outputs
target_devices:
  - dbus
  - mouse

mapping:
  - name: Navigate north
    source_event: {gamepad: {button: DPadUp}}
    target_events: [{dbus: ui_up}]
  - name: Navigate south
    source_event: {gamepad: {button: DPadDown}}
    target_events: [{dbus: ui_down}]
  - name: Navigate west
    source_event: {gamepad: {button: DPadLeft}}
    target_events: [{dbus: ui_left}]
  - name: Navigate east
    source_event: {gamepad: {button: DPadRight}}
    target_events: [{dbus: ui_right}]
  - name: Activate
    source_event: {gamepad: {button: South}}
    target_events: [{dbus: ui_accept}]
  - name: Close launcher
    source_event: {gamepad: {button: East}}
    target_events: [{dbus: ui_back}]
  - name: Toggle Grid or List
    source_event: {gamepad: {button: West}}
    target_events: [{dbus: ui_action}]
  - name: Toggle launcher
    source_event: {gamepad: {button: Start}}
    target_events: [{dbus: ui_option}]

  - name: Pointer
    source_event: {gamepad: {axis: {name: RightStick, deadzone: 0.2}}}
    target_events: [{mouse: {motion: {speed_pps: 900}}}]
  - name: Scroll up
    source_event: {gamepad: {axis: {name: LeftStick, direction: up, deadzone: 0.25}}}
    target_events: [{mouse: {button: WheelUp}}]
  - name: Scroll down
    source_event: {gamepad: {axis: {name: LeftStick, direction: down, deadzone: 0.25}}}
    target_events: [{mouse: {button: WheelDown}}]
  - name: Primary click
    source_event: {gamepad: {button: RightBumper}}
    target_events: [{mouse: {button: Left}}]
  - name: Secondary click
    source_event: {gamepad: {button: LeftBumper}}
    target_events: [{mouse: {button: Right}}]

# Guide, View, North, L3/R3, LT/RT remain deliberately unbound in HSN-001.
