---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: starlight-hearth
description: starlightOS Hearth - Bazzite-based living-room gaming and remote workstation

base-image: ghcr.io/ublue-os/bazzite-deck
image-version: stable

modules:
  # Starlight-owned files. Keep this first and keep the directory small.
  - type: files
    files:
      - source: system
        destination: /

  # Default GUI applications. Flathub is used when no repo is specified.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.jellyfin.JellyfinDesktop
          - io.mpv.Mpv
          - org.localsend.localsend_app
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter

      # Also make a user-scoped Flathub remote available so a normal user can
      # install personal Flatpaks without turning the OS recipe into an app lockfile.
      - scope: user

  # Bazzite already contains Tailscale. Starlight requires the daemon to exist
  # and start automatically for its remote-management policy.
  - type: systemd
    system:
      enabled:
        - tailscaled.service

  # Native Starlight maintenance commands become part of Bazzite's `ujust`.
  - type: justfiles
    validate: true

  # Keep signing last.
  - type: signing