---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: starlight-hearth
description: hearthOS - controller-first living-room gaming and desktop operating system

base-image: ghcr.io/ublue-os/bazzite-deck
image-version: stable
platforms:
  - linux/amd64
# BlueBuild appends `-installer` when it templates the CLI copy stage.
blue-build-tag: v0.9.37

modules:
  # Hearth Shell retains DMS's Fedora repository for its Quickshell and dgop
  # runtime dependencies. The shell itself is installed from the immutable,
  # checksum-pinned Hearth release below.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - avengemedia/dms
    install:
      packages:
        - quickshell
        - dgop
        - niri
        - xwayland-satellite

  - type: script
    scripts:
      - install-hearth-shell.sh

  # Starlight-owned session contracts and defaults.
  - type: files
    files:
      - source: system
        destination: /

  # Create package-owned integration links and fail the image build if its
  # required executables or session files are absent.
  - type: script
    scripts:
      - configure-hearth-session.sh

  # Default GUI applications. Flathub is used when no repo is specified.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.jellyfin.JellyfinDesktop
          - io.mpv.Mpv
          - org.localsend.localsend_app
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter

      # Also make a user-scoped Flathub remote available so a normal user can
      # install personal Flatpaks without turning the OS recipe into an app lockfile.
      - scope: user

  # Bazzite already contains Tailscale. Starlight requires the daemon to exist
  # and start automatically for its remote-management policy.
  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - hearth-identity.service
        - hearth-input-adapter.service

  # Native Starlight maintenance commands become part of Bazzite's `ujust`.
  - type: justfiles
    validate: true

  # Keep Bazzite/Fedora ID, ID_LIKE, and VERSION_ID for compatibility.
  - type: os-release
    properties:
      NAME: hearthOS
      PRETTY_NAME: hearthOS
      VARIANT: Hearth
      VARIANT_ID: hearth
      LOGO: hearth-logo
      DEFAULT_HOSTNAME: hearth
      HOME_URL: https://github.com/akippnn/starlight-hearth
      DOCUMENTATION_URL: https://github.com/akippnn/starlight-hearth#readme
      SUPPORT_URL: https://github.com/akippnn/starlight-hearth/issues
      BUG_REPORT_URL: https://github.com/akippnn/starlight-hearth/issues
      BOOTLOADER_NAME: hearthOS
      IMAGE_ID: starlight-hearth

  # Verify the final filesystem after identity customization. This emits exact
  # package versions into the build log and turns missing recovery contracts
  # into a build failure rather than a hardware-audit surprise.
  - type: script
    scripts:
      - verify-hearth-image.sh

  # Keep signing last.
  - type: signing
